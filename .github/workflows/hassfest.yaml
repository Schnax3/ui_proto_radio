name: Home Assistant Validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  validate:
    name: Validate integration
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Hassfest
        uses: home-assistant/actions/hassfest@master
